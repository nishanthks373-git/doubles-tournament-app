<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tournament scheduler</title>
<style>
:root{--bg:#eef1fb;--card:#fff;--tx:#17203a;--mu:#5f6b8a;--ac:#3b5bdb;--on:#fff;--tint:#e5eafd;--bd:#d9def2;--wn:#d6336c;--ta:#1c7ed6;--tb:#e8590c;--g1:#3b5bdb;--g2:#7048e8;--hl:#fff4c2;--ql:#e6fcf5}
@media(prefers-color-scheme:dark){:root{--bg:#0f1426;--card:#1a2140;--tx:#eaeefc;--mu:#98a3c7;--ac:#8ea2ff;--on:#0f1426;--tint:#27305a;--bd:#2c3566;--wn:#ff7aa8;--ta:#74c0fc;--tb:#ffa94d;--g1:#4263eb;--g2:#7950f2;--hl:#3b3a22;--ql:#12362d}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:1.3rem;margin:0;flex:1}h2{font-size:1.05rem;margin:0 0 .5rem}
.top{display:flex;align-items:center;gap:8px;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;border-radius:14px;padding:14px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 16px;background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;width:100%;margin-top:8px}
button.ghost{background:none;color:var(--ac);width:auto;margin:0;padding:8px 4px}
.top button.ghost{color:#fff}
button.sec{background:var(--tint);color:var(--ac)}
button.warn{background:#f08c00;color:#fff}
button.danger{background:none;color:var(--wn);border:1px solid var(--wn)}
button.arm{background:var(--wn);color:#fff}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
.rnd{display:inline-block;background:var(--ac);color:var(--on);border-radius:14px;padding:3px 14px}
.match{padding:10px 0;border-top:1px solid var(--bd)}.match:first-of-type{border-top:0}
.ln{display:flex;align-items:center;gap:10px;padding:3px 0}.tm{flex:1;font-weight:700}
.ln input{width:80px;text-align:center;font-size:1.25rem;font-weight:700;border-width:2px}
.ln.a .tm{color:var(--ta)}.ln.a input{border-color:var(--ta)}
.ln.b .tm{color:var(--tb)}.ln.b input{border-color:var(--tb)}
.vs{color:var(--mu);font-size:.8rem}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-size:.75rem;font-weight:600;white-space:normal;line-height:1.15;vertical-align:bottom}.r{text-align:right}
tr.top1 td{background:var(--hl)}.pt{color:var(--ac)}
.rk{display:inline-block;min-width:26px;text-align:center;border-radius:13px;padding:1px 6px;font-weight:700;background:var(--tint)}
.rk1{background:#ffd43b;color:#3b2f00}.rk2{background:#ced4da;color:#222}.rk3{background:#f0a868;color:#3a1c00}
.mu{color:var(--mu);font-size:.9rem}
.win{background:linear-gradient(120deg,#ffd43b,#ff922b);color:#2b1d00;border:0;font-size:1.1rem}
.tag{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:12px;font-size:.85rem;font-weight:600}
.live{background:#fff3bf;color:#7a5a00}.done{background:#d3f9d8;color:#1b6b2f}
.exp{display:flex;gap:8px}.exp button{flex:1;padding:10px 4px;margin-top:6px}
.c1{background:#087f5b}.c2{background:#2b8a3e}.c3{background:#e03131}.c4{background:#7048e8}
details{padding:8px 0;border-top:1px solid var(--bd)}summary{font-weight:600}
.item{cursor:pointer}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#16202c;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.sw{display:flex;align-items:center;gap:12px;margin:0;padding:10px 0;border-top:1px solid var(--bd);font-size:1rem;color:var(--tx)}
.sw input{width:24px;height:24px;padding:0;accent-color:var(--ac);flex:none}
.off{background:#e9ecef;color:#495057;margin-left:6px}
.scr{overflow-x:auto;margin:0 -6px}
.scr table{width:100%}
.scr th:nth-child(n+3){min-width:44px}
.scr td:nth-child(-n+2),.scr th:nth-child(-n+2){position:sticky;background:var(--card);z-index:1}
.scr td:first-child,.scr th:first-child{left:0;min-width:46px}
.scr td:nth-child(2),.scr th:nth-child(2){left:46px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.scr tr.top1 td{background:var(--hl)}
.pr{cursor:pointer}.pr .cv{display:inline-block;width:14px;color:var(--mu);font-size:.75rem;transition:transform .15s}
.pr.open .cv{transform:rotate(90deg)}
.pr.open td{border-bottom-color:transparent}
.scr td.det{position:static;left:auto;max-width:none;white-space:normal;padding:0 6px 10px;background:var(--card)}
.detin{position:sticky;left:0;width:calc(100vw - 72px);max-width:500px;box-sizing:border-box}
.gm{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--bd)}
.gi{flex:1;min-width:0}.gi .mu{font-size:.85rem}
.wl{flex:none;min-width:48px;text-align:center;border-radius:10px;padding:2px 6px;font-size:.8rem;font-weight:700}
.wl.W{background:#d3f9d8;color:#1b6b2f}.wl.L{background:#ffe3e3;color:#a61e4d}.wl.D{background:#e9ecef;color:#495057}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:112px;margin:0;padding:12px;border-radius:16px;color:#fff;font-size:1.05rem}
.tile .em{font-size:2.1rem;line-height:1.15}.tile .sub{font-size:.8rem;font-weight:500;opacity:.92}
.tile.more{background:var(--tint);color:var(--ac)}
.tile.wide{align-items:flex-start;text-align:left;min-height:0;background:linear-gradient(90deg,var(--g1),var(--g2));margin-top:10px;width:100%;padding:14px 16px}
.tile.wide b{font-size:1.05rem}
.pair{display:flex;gap:8px;align-items:center;margin-bottom:8px}.pair .mu{flex:none;width:54px}
tr.qual td{background:var(--ql)}tr.qual td:first-child{box-shadow:inset 4px 0 #12b886}
.scr tr.qual td{background:var(--ql)}
.gh{margin:14px 0 6px;font-size:.95rem}
.brwrap{overflow:auto;border:1px solid var(--bd);border-radius:10px;background:#fff;max-height:70vh}
.tmb{margin-bottom:10px;padding:8px;border-radius:12px;background:var(--tint)}.tmb summary{margin-top:6px;color:var(--ac);font-weight:600}.gh{margin:12px 0 4px}.ckn{width:64px;text-align:center;padding:8px 4px;margin:0}.ckr{display:flex;gap:6px;align-items:center;margin-top:4px}.ckr2{display:flex;gap:6px}.ckr2 select{flex:1}.inn{margin-top:10px}.nr{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}.nr input{width:auto;margin:0}.tie{font-size:12px;color:var(--ac)}.tie select{font-size:12px;padding:2px 4px;width:auto;margin:2px 0 0;display:inline-block}.seg{display:flex;gap:8px}.seg button{margin-top:4px;background:var(--tint);color:var(--ac)}.seg button.on{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff}
</style></head><body>
<div class="wrap" id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db;try{db=JSON.parse(localStorage.getItem('dt_v1'))||{t:[]}}catch(e){db={t:[]}}
const save=()=>{try{localStorage.setItem('dt_v1',JSON.stringify(db))}catch(e){toast('Could not save data')}};
let view={n:'home'},draft,armed=null,pending=null,ctx={sport:'badminton',mode:'rot'},d2=null,showMore=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const T=()=>db.t.find(t=>t.id===view.id);
function toast(m){const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2600)}

/* ---- scoring ---- */
function stat(t){const s=t.players.map(()=>({pw:0,pl:0,gp:0,gw:0,gl:0}));
 t.rounds.forEach(r=>r.closed&&r.matches.forEach(m=>[[m.a,m.sa,m.sb],[m.b,m.sb,m.sa]].forEach(([tm,f,a])=>tm.forEach(i=>{const x=s[i];x.pw+=f;x.pl+=a;x.gp++;if(f>a)x.gw++;else if(f<a)x.gl++}))));return s}
function standings(t){const p=stat(t);return t.players.map((n,i)=>{const x=p[i],g=x.gp?x.pw/x.gp:0;return{n,i,...x,pts:x.pw,ppg:Math.round(g*100)/100,k:Math.round(g*10000)}}).sort((a,b)=>b.k-a.k||b.pw-a.pw||a.n.localeCompare(b.n))}
const winners=t=>{const s=standings(t);return s.filter(x=>x.k===s[0].k)};

/* ---- random round: all-new partners first, then least-repeated; opponents mixed ---- */
function makeRound(t){
 const n=t.players.length,k=(a,b)=>Math.min(a,b)+'-'+Math.max(a,b),pc={},oc={},sat=Array(n).fill(0);
 const add=(o,a,b)=>{o[k(a,b)]=(o[k(a,b)]||0)+1};
 t.rounds.forEach(r=>{r.matches.forEach(m=>{add(pc,...m.a);add(pc,...m.b);m.a.forEach(p=>m.b.forEach(q=>add(oc,p,q)))});r.sitting.forEach(i=>sat[i]++)});
 const idx=[...Array(n).keys()];
 for(let lvl=t.lvl||0;lvl<=60;lvl++){ /* lvl = how many times a pair may already have partnered */
  let best=null,found=0;
  for(let a=0;a<80&&found<12;a++){
   const o=idx.map(i=>[i,sat[i]+Math.random()*(1+a/20)]).sort((x,y)=>x[1]-y[1]).map(x=>x[0]);
   const sitting=o.slice(0,n%4),act=o.slice(n%4);let steps=0;
   const pair=l=>{if(!l.length)return[];if(++steps>4000)return null;const f=l[0],rest=l.slice(1);
    const c=shuffle(rest).filter(p=>(pc[k(f,p)]||0)<=lvl).sort((x,y)=>(pc[k(f,x)]||0)-(pc[k(f,y)]||0));
    for(const p of c){const r=pair(rest.filter(x=>x!==p));if(r)return[[f,p]].concat(r)}return null};
   const teams=pair(shuffle(act));
   if(!teams)continue;
   found++;const cost=teams.reduce((s,tm)=>s+(pc[k(...tm)]||0),0);
   if(!best||cost<best.cost)best={teams,sitting,cost};
   if(cost===0)break;
  }
  if(best){t.lvl=lvl;return layout(best.teams,best.sitting,oc,k)}
 }
 return null}
/* pair the teams up so opponents have met as rarely as possible (random among the best) */
function layout(teams,sitting,oc,k){
 let bm=null,bc=Infinity;
 for(let a=0;a<200&&bc>0;a++){
  const s=shuffle(teams);let c=0;
  for(let i=0;i<s.length;i+=2)s[i].forEach(p=>s[i+1].forEach(q=>c+=oc[k(p,q)]||0));
  if(c<bc){bc=c;bm=s}
 }
 const matches=[];for(let i=0;i<bm.length;i+=2)matches.push({a:bm[i],b:bm[i+1],sa:null,sb:null});
 return{matches,sitting,closed:false}}

/* ---- actions ---- */
function go(n,id){view={n,id};armed=null;render();scrollTo(0,0)}
const PARENT={list:'home',hub:'mode',mode:'home',fmt:'hub',newx:'fmt',newt:'fmt',teams:'newt',roster:'x',new:'hub',t:'hub',x:'hub',all:'hub',soon:'home',assign:'home',imp:'home'};
const racket=()=>SP[ctx.sport]&&SP[ctx.sport][2]===1,hubOf=()=>racket()?'list':'hub';
function parentOf(n){
 let p=PARENT[n]||'home';
 if(racket()){if(n==='list')p='home';else if(n==='mode')p='list';else if(n==='fmt'||n==='new')p='mode';else if(p==='hub')p='list'}
 else if(p==='mode')p='home';
 return p}
window.goBack=()=>{if(view.n==='home')return false;const p=parentOf(view.n);go(p,p==='x'?view.id:undefined);return true};
function backH(){return '<div class=top><button class=ghost onclick="goBack()">&lsaquo; Back</button>'}
function newT(){draft={name:'',count:8,names:Array(8).fill('')};go('new')}
function setCount(v){const c=Math.min(40,Math.max(0,parseInt(v)||0));draft.count=c;while(draft.names.length<c)draft.names.push('');$('#names').innerHTML=namesHtml()}
function start(){
 const names=draft.names.slice(0,draft.count).map(s=>s.trim());
 if(draft.count<4)return toast('You need at least 4 players');
 if(names.some(x=>!x))return toast('Enter a name for every player');
 if(new Set(names.map(x=>x.toLowerCase())).size<names.length)return toast('Player names must be different');
 const t={id:Date.now(),name:draft.name.trim()||'Tournament '+(sel().length+1),date:new Date().toISOString().slice(0,10),sport:ctx.sport,mode:'rot',players:names,rounds:[],done:false};
 t.rounds.push(makeRound(t));db.t.push(t);save();go('t',t.id)}
function sc(i,s,v){const t=T(),r=t.rounds[t.rounds.length-1];r.matches[i]['s'+s]=v===''?null:Math.max(0,parseInt(v,10)||0);save()}
const openR=new Set();function tg(k,o){o?openR.add(k):openR.delete(k)}
function scPast(ri,mi,side,v){
 const t=T(),n=parseInt(v,10);
 if(t.done||!(n>=0)){toast('Enter a score of 0 or more');render();return}
 t.rounds[ri].matches[mi]['s'+side]=n;save();render();toast('Score updated')}
function complete(){
 const t=T(),r=t.rounds[t.rounds.length-1];
 if(r.matches.some(m=>m.sa===null||m.sb===null))return toast('Enter the score for every match');
 r.closed=true;
 const n=makeRound(t);if(n)t.rounds.push(n);else{t.done=true;t.note='Tournament finished: no further round could be drawn.'}
 save();render();scrollTo(0,0)}
const act={
 end(){const t=T(),r=t.rounds[t.rounds.length-1];if(r.matches.every(m=>m.sa!==null&&m.sb!==null))r.closed=true;else t.rounds.pop();t.done=true;save();render()},
 del(){db.t=db.t.filter(x=>x.id!==view.id);save();go(hubOf())}};
function arm(k){if(armed===k){armed=null;act[k]()}else{armed=k;render();setTimeout(()=>{if(armed===k){armed=null;render()}},3000)}}

function toggleEx(id){const t=db.t.find(x=>x.id===id);t.ex=!t.ex;save();render()}

/* ---- views ---- */
const tn=(t,p)=>p.map(i=>esc(t.players[i])).join(' &amp; ');
const rankOf=(rows,r)=>rows.findIndex(x=>x.k===r.k)+1;
/* a player's games, newest first: one tournament (tid) or every counted tournament (tid=null) */
function gamesOf(name,tid){
 const K=name.toLowerCase(),out=[];
 (tid===null?rotSel().filter(t=>!t.ex):db.t.filter(t=>t.id===tid)).forEach(t=>{
  const pi=t.players.findIndex(n=>n.toLowerCase()===K);if(pi<0)return;
  t.rounds.forEach((r,ri)=>r.closed&&r.matches.forEach(m=>{
   const mine=m.a.includes(pi)?[m.a,m.b,m.sa,m.sb]:m.b.includes(pi)?[m.b,m.a,m.sb,m.sa]:null;if(!mine)return;
   const [tm,op,f,a]=mine;
   out.push({tid:t.id,tn:t.name,date:t.date,r:ri+1,partner:t.players[tm.find(x=>x!==pi)],opp:op.map(x=>t.players[x]),f,a,res:f>a?'W':f<a?'L':'D'})}))});
 return out.sort((x,y)=>y.tid-x.tid||y.r-x.r)}
function togglePlayer(tr,tid){
 const nx=tr.nextElementSibling;
 if(nx&&nx.classList.contains('detrow')){nx.remove();tr.classList.remove('open');return}
 const g=gamesOf(tr.dataset.name,tid),cols=tr.children.length,all=tid===null;
 const L={W:'Won',L:'Lost',D:'Draw'};
 const body=g.length?g.map(x=>`<div class=gm><span class="wl ${x.res}">${L[x.res]}</span><div class=gi><div><b>${x.f} to ${x.a}</b> with ${esc(x.partner)}</div><div class=mu>vs ${x.opp.map(esc).join(' &amp; ')}</div><div class=mu>${all?esc(x.tn)+', ':''}Round ${x.r}${all?', '+x.date:''}</div></div></div>`).join(''):'<p class=mu>No completed games yet.</p>';
 const d=document.createElement('tr');d.className='detrow';
 d.innerHTML=`<td class=det colspan=${cols}><div class=detin><div class=mu style="margin-bottom:4px"><b>${esc(tr.dataset.name)}</b>: ${g.length} game${g.length===1?'':'s'}, newest first</div>${body}</div></td>`;
 tr.after(d);tr.classList.add('open')}
const prow=(name,tid)=>`data-name="${esc(name)}" tabindex=0 role=button onclick="togglePlayer(this,${tid})" onkeydown="if(event.key==='Enter')togglePlayer(this,${tid})"`;
const PAL=['#3b5bdb','#e8590c','#2f9e44','#d6336c','#7048e8','#f08c00'];
const rkb=(k,p)=>`<span class="rk ${k<4&&p>0?'rk'+k:''}">${k}</span>`;
function tbl(rows,tid){return '<div class=scr><table><tr><th>Rank</th><th>Player</th><th class=r>Points won</th><th class=r>Points lost</th><th class=r>Games played</th><th class=r>Games won</th><th class=r>Games lost</th><th class=r>Points per game</th></tr>'+rows.map(r=>{const k=rankOf(rows,r);return `<tr class="pr ${k===1&&r.pts>0?'top1':''}" ${prow(r.n,tid)}><td>${rkb(k,r.pts)}</td><td><span class=cv>▸</span>${esc(r.n)}</td><td class=r>${r.pw}</td><td class=r>${r.pl}</td><td class=r>${r.gp}</td><td class=r>${r.gw}</td><td class=r>${r.gl}</td><td class=r><b class=pt>${r.ppg}</b></td></tr>`}).join('')+'</table></div>'}
function vHub(){
 const [n,e]=SP[ctx.sport],rot=ctx.mode==='rot',L=sel(),u=unitOf(ctx.mode);
 let h=backH()+`<h1>${e} ${n}</h1></div><div class=mu style="margin:-6px 0 12px">${MODES[ctx.mode]}</div><button onclick="${rot?'newT()':"go('fmt')"}">New tournament</button>`+(rot?`<button class=sec onclick="go('all')">🏆 Leaderboard</button>`:'')+'<h2 style="margin:20px 0 8px">Your tournaments</h2>';
 if(!L.length)h+='<p class=mu>Nothing here yet. Tap New tournament to get started.</p>';
 L.slice().reverse().forEach((t,i)=>{
  if(rot)h+=`<div class="card item" style="border-left-color:${PAL[i%6]}" onclick="go('t',${t.id})"><b>${esc(t.name)}</b><div class=mu>${t.date}, ${t.players.length} players</div><div class="tag ${t.done?'done':'live'}">${t.done?'Finished: '+winners(t).map(x=>esc(x.n)).join(', ')+' ('+standings(t)[0].ppg+' pts/game)':'In progress, round '+t.rounds.length}</div>${t.ex?'<div class="tag off">Not in leaderboard</div>':''}</div>`;
  else{const ch=champ(t);h+=`<div class="card item" style="border-left-color:${PAL[i%6]}" onclick="go('x',${t.id})"><b>${esc(t.name)}</b><div class=mu>${t.date}, ${t.ent.length} ${u}, ${FS[t.fmt]}</div><div class="tag ${ch!==null?'done':'live'}">${ch!==null?'Champion: '+esc(t.ent[ch].n):'In progress'}</div></div>`}});
 return h}
function namesHtml(){return draft.names.slice(0,draft.count).map((n,i)=>`<input style="margin-bottom:8px" value="${esc(n)}" placeholder="Player ${i+1}" oninput="draft.names[${i}]=this.value">`).join('')}
function vNew(){return backH()+'<h1>New tournament</h1></div><div class=card>'+
 `<label>Tournament name</label><input value="${esc(draft.name)}" placeholder="e.g. Sunday doubles" oninput="draft.name=this.value">
 <label>Number of players (at least 4)</label><input type=number inputmode=numeric min=4 max=40 value="${draft.count}" oninput="setCount(this.value)">
 <h2 style="margin-top:18px">Player names</h2><div id=names>${namesHtml()}</div>
 <p class=mu>Rounds keep coming until you finish the tournament. Partners are new every round until all pairings have been played, then teams may repeat but opponents are mixed. If the player count is not a multiple of 4, the extra players sit out and rotate fairly.</p>
 <button onclick="start()">Start tournament</button></div>`}
const expRow=k=>`<div class=mu style="margin-top:14px">Download this table</div><div class=exp><button class="c1" onclick="exportTable('${k}','csv')">CSV</button><button class="c2" onclick="exportTable('${k}','xlsx')">Excel</button><button class="c3" onclick="exportTable('${k}','pdf')">PDF</button><button class="c4" onclick="exportTable('${k}','png')">Image</button></div>`;
function vT(){
 const t=T();if(!t){view={n:'home'};return vHome()}
 const last=t.rounds[t.rounds.length-1],st=standings(t);
 let h=backH()+`<h1>${esc(t.name)}</h1></div>`;
 if(t.done){const w=winners(t);h+=`<div class="card win">🏆 ${w.length>1?'Winners':'Winner'}: <b>${w.map(x=>esc(x.n)).join(' &amp; ')}</b> with ${st[0].ppg} points per game</div>`;if(t.note)h+=`<p class=mu>${t.note}</p>`}
 else{

const WK=4,OPP=[0.8,1.2],TF=[0.02,1.2],PF=[0.02,1.1];
function allRows(){
 const ts=rotSel().filter(t=>!t.ex),m={},K=n=>n.toLowerCase();
 ts.forEach(t=>{const st=standings(t),top=st.length?st[0].k:0;
  st.forEach(p=>{const e=m[K(p.n)]||(m[K(p.n)]={n:p.n,pts:0,pl:0,gp:0,gw:0,gl:0,tp:0,w:0,wp:0});
   e.pts+=p.pw;e.pl+=p.pl;e.gp+=p.gp;e.gw+=p.gw;e.gl+=p.gl;if(p.gp>0)e.tp++;if(t.done&&p.k===top&&top>0&&p.gp>0)e.w++})});
 const R=Object.values(m),TP=R.reduce((a,e)=>a+e.pts,0),TG=R.reduce((a,e)=>a+e.gp,0),avg=TG?TP/TG:0;
 /* opponent strength: points per game vs the overall average (1 = average), pulled toward 1 for players with few games */
 const sp=n=>{const e=m[K(n)];return avg?((e.pts+WK*avg)/(e.gp+WK))/avg:1};
 ts.forEach(t=>{const w={},g={};
  t.rounds.forEach(r=>r.closed&&r.matches.forEach(mt=>[[mt.a,mt.b,mt.sa],[mt.b,mt.a,mt.sb]].forEach(([tm,op,f])=>{
   const o=Math.min(OPP[1],Math.max(OPP[0],op.reduce((a,i)=>a+sp(t.players[i]),0)/2));
   tm.forEach(i=>{const k=K(t.players[i]);w[k]=(w[k]||0)+f*o;g[k]=(g[k]||0)+1})})));
  Object.keys(w).forEach(k=>m[k].wp+=w[k]*Math.min(TF[1],1+TF[0]*(g[k]-1)))});
 return R.map(e=>({...e,k:e.gp?Math.round(e.pts/e.gp*10000):0,ppg:e.gp?Math.round(e.pts/e.gp*100)/100:0,wpts:Math.round(e.wp*Math.min(PF[1],1+PF[0]*(Math.max(e.tp,1)-1))*10)/10})).sort((a,b)=>b.k-a.k||b.pts-a.pts||a.n.localeCompare(b.n))}

function seedOrder(n){let o=[1];while(o.length<n){const s=o.length*2+1;o=o.flatMap(x=>[x,s-x])}return o}
/* order = entrants best seed first; seeds beyond the number of entrants become byes for the top seeds */
function addBracket(t,order,st){
 const n=order.length;let size=1;while(size<n)size*=2;
 const so=seedOrder(size),rounds=Math.round(Math.log2(size));let prev=[];
 for(let r=0;r<rounds;r++){
  const cnt=size/Math.pow(2,r+1),cur=[];
  for(let p=0;p<cnt;p++){
   const m={id:t.nid++,st,rd:r,pos:p,tb:t.mode==='team'&&RULE[t.sport].tb?1:0,w:null,lab:cnt===1?'Final':cnt===2?'Semifinal':cnt===4?'Quarterfinal':'Round of '+cnt*2,a:null,b:null,sa:null,sb:null};
   if(r===0){const x=so[2*p],y=so[2*p+1];m.a=x<=n?order[x-1]:null;m.b=y<=n?order[y-1]:null;if(m.a===null||m.b===null)m.bye=true}
   else{m.ca=prev[2*p].id;m.cb=prev[2*p+1].id}
   cur.push(m);t.m.push(m)}
  prev=cur}
 settle(t)}
/* round robin by the circle method: everyone in the list plays everyone once */
function addLeagueOf(t,idsIn,g){
 const ids=shuffle(idsIn);if(ids.length%2)ids.push(null);const n=ids.length;
 for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const a=ids[i],b=ids[n-1-i];if(a!==null&&b!==null){const m={id:t.nid++,st:'L',rd:r,a,b,sa:null,sb:null};if(t.mode==='team'&&RULE[t.sport].draw){m.dr=1;if(t.pen)m.tb=1}if(g!==undefined)m.g=g;t.m.push(m)}}ids.splice(1,0,ids.pop())}}

/* each knockout round removes teams until exactly nl are left; those teams then play a league */
function klPlan(n,nl){const r=[];let cur=n;while(cur>nl){const e=Math.min(cur-nl,Math.floor(cur/2));r.push({from:cur,m:e,bye:cur-2*e});cur-=e}return r}
function klHint(n,nl,u){
 if(!(n>=3))return `Use at least 3 ${u}.`;if(!(nl>=2&&nl<n))return `The final league needs between 2 and ${n-1} ${u}.`;
 const p=klPlan(n,nl);return `${p.length} knockout ${p.length===1?'round':'rounds'}: ${p.map(x=>x.from).join(' to ')} to ${nl} ${u}. Then those ${nl} play each other once in a league.`+(p.some(x=>x.bye)?' When the numbers are odd, the extra '+u+' get a bye.':'')}
function klRound(t,alive,r){
 const e=Math.min(alive.length-t.nl,Math.floor(alive.length/2)),by=alive.length-2*e,mk=o=>Object.assign({id:t.nid++,st:'K',rd:r,lab:'Knockout round '+(r+1),a:null,b:null,sa:null,sb:null,w:null,tb:t.mode==='team'&&RULE[t.sport].tb?1:0},o);
 alive.slice(0,by).forEach(x=>t.m.push(mk({a:x,bye:true})));
 const rest=alive.slice(by);for(let i=0;i<rest.length;i+=2)t.m.push(mk({a:rest[i],b:rest[i+1]}))}
function klStep(t){
 if(t.fmt!=='kl')return false;
 const before=t.m.length;let changed=false;
 const K=()=>t.m.filter(m=>m.st==='K'),rounds=()=>[...new Set(K().map(m=>m.rd))].sort((a,b)=>a-b);
 for(const r of rounds()){
  if(K().filter(m=>m.rd===r).some(m=>m.kw!==undefined&&m.kw!==W(m))){
   const n0=t.m.length;t.m=t.m.filter(m=>(m.st==='K'&&m.rd<=r));t.lg=null;if(t.m.length!==n0)changed=true;break}}
 K().forEach(m=>{m.kw=W(m)});
 const rs=rounds(),last=K().filter(m=>m.rd===rs[rs.length-1]);
 if(last.length&&last.every(m=>W(m)!==null)){
  const alive=last.map(W);
  if(alive.length>t.nl){klRound(t,alive,rs[rs.length-1]+1)}
  else if(!t.m.some(m=>m.st==='L')){t.lg=alive.slice();addLeagueOf(t,alive)}}

 return changed||t.m.length!==before}
const sameScore=m=>m.sa!==null&&m.sb!==null&&m.sa===m.sb;

const played=m=>m.sa!==null&&m.sb!==null&&(m.sa!==m.sb||(!!m.dr&&(!m.tb||!!m.w)));
function W(m){
 if(m.bye)return m.a!==null?m.a:m.b;

/* fill each later match from the winners of the two matches that feed it; clear scores whose players changed */
function settle(t){

 t.m.slice().sort((x,y)=>x.rd-y.rd).forEach(m=>{
  if(m.ca===undefined)return;

  if(m.a!==a||m.b!==b){if(m.sa!==null||m.sb!==null)cleared++;m.a=a;m.b=b;m.sa=null;m.sb=null;m.w=null}});
 return cleared}
function finalOf(t){const p=t.m.filter(m=>m.st==='P');return p.length?p.reduce((a,b)=>b.rd>a.rd?b:a):null}

const roOf=(t,i)=>(t.ro&&t.ro[i])||99;
